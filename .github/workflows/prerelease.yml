name: Android prerelease

on:
  push:
    tags: ['v*-alpha.*', 'v*-beta.*', 'v*-rc.*']

permissions:
  contents: write
  actions: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TRANSMICRONE_APP_ID: ${{ secrets.TRANSMICRONE_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android/**/*.gradle.kts
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install build packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: Configure private release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD', 'TRANSMICRONE_APP_ID']
          assert all(os.environ.get(name) for name in names), 'Missing release secrets'
          assert os.environ['TRANSMICRONE_APP_ID'] not in ['unconfigured', 'ci-not-configured']
          key = Path(os.environ['RUNNER_TEMP']) / 'transmicrone-release.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          key.chmod(0o600)
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          fields = {'STORE_FILE': str(key), 'STORE_PASSWORD': os.environ['STORE_PASSWORD'], 'KEY_ALIAS': os.environ['KEY_ALIAS'], 'KEY_PASSWORD': os.environ['KEY_PASSWORD']}
          config = Path('signing.local.properties')
          config.write_text(''.join(f'{name}={escape(value)}\n' for name, value in fields.items()))
          config.chmod(0o600)
          PY
      - name: Test, lint, and build live release
        working-directory: android
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease -PmockFeed=false
      - name: Verify and package APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          config = Path('android/app/build/generated/source/buildConfig/release/co/camilo/transmicrone/BuildConfig.java').read_text()
          assert 'MOCK_FEED = false' in config
          assert 'DEBUG = false' in config
          version = re.search(r'VERSION_NAME = "([^"]+)"', config).group(1)
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag/version mismatch'
          assert Path('docs/releases/' + os.environ['RELEASE_TAG'] + '.md').is_file()
          PY
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/transmicrone-${RELEASE_TAG}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Upload signed artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-prerelease
          path: dist/
          if-no-files-found: error
      - name: Wait for Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          for attempt in range(120):
              runs = json.loads(subprocess.check_output(['gh', 'run', 'list', '--workflow', 'android.yml', '--commit', os.environ['GITHUB_SHA'], '--json', 'status,conclusion'], text=True))
              if runs and runs[0]['status'] == 'completed':
                  assert runs[0]['conclusion'] == 'success', 'Android CI failed; release will not publish'
                  break
              time.sleep(10)
          else:
              raise SystemExit('Android CI did not finish within 20 minutes')
          PY
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "Transmicrone $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
      - name: Remove private signing files
        if: always()
        run: rm -f signing.local.properties "$RUNNER_TEMP/transmicrone-release.jks"
