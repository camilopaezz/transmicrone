name: Compare retained catalog samples

on:
  workflow_dispatch:
  push:
    branches: [t3/catalog-over-the-air-updates]
    paths: [.github/workflows/catalog-compare.yml]

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download full retained responses
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39133571125 --name catalog-overnight-reports --dir "$RUNNER_TEMP/samples"
      - name: Verify bodies and compare actual parsed data
        run: |
          mkdir -p "$RUNNER_TEMP/comparison"
          python3 docs/experiments/2026-10-18/compare_noon.py "$RUNNER_TEMP/samples" "$RUNNER_TEMP/comparison/noon-comparison.json"
      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-noon-comparison
          path: ${{ runner.temp }}/comparison/
          if-no-files-found: error
          retention-days: 30
