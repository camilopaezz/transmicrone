name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRANSMICRONE_APP_ID: ci-not-configured

jobs:
  approval:
    name: PR author approval
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'camilopaezz' && 'pr-maintainer-approval' || 'owner-ci' }}
    steps:
      - name: Continue after maintainer approval
        run: echo 'PR author approval passed'

  build:
    name: Unit tests, lint, and APK
    needs: approval
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android build packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: Check Python tools
        working-directory: .
        run: |
          python3 -m compileall -q scripts tools
          python3 -m unittest discover -s tests -v
      - name: Test, lint, and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transmicrone-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build live PR APK
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TRANSMICRONE_APP_ID: ${{ secrets.TRANSMICRONE_APP_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./gradlew --no-daemon :app:testPrUnitTest :app:lintPr :app:assemblePr -PmockFeed=false -PprNumber="$PR_NUMBER"
      - name: Verify PR APK
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          config = Path('app/build/generated/source/buildConfig/pr/co/camilo/transmicrone/BuildConfig.java').read_text()
          number = os.environ['PR_NUMBER']
          assert f'APPLICATION_ID = "co.camilo.transmicrone.pr{number}"' in config
          assert f'-pr.{number}"' in config
          assert 'MOCK_FEED = false' in config
          assert 'DEBUG = false' in config
          app_id = re.search(r'FEED_APPID = "([^"]+)"', config).group(1)
          assert app_id.strip() and app_id not in ['unconfigured', 'ci-not-configured']
          PY
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify app/build/outputs/apk/pr/app-pr.apk
          mkdir -p ../dist
          cp app/build/outputs/apk/pr/app-pr.apk "../dist/transminuto-pr-${PR_NUMBER}.apk"
          cd ../dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Upload live PR APK
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transminuto-pr-${{ github.event.pull_request.number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: android/app/build/reports/
          retention-days: 14

  emulator:
    name: Android 15 instrumented tests
    needs: approval
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android build packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: Enable emulator acceleration
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Upload device-test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-reports
          path: android/app/build/reports/androidTests/
          retention-days: 14
